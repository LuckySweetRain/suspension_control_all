<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif; font-size: 18px; fill: #475569; }
      .box-title { font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .box-text { font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif; font-size: 16px; fill: #334155; }
      .small { font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif; font-size: 14px; fill: #475569; }
      .note { font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif; font-size: 16px; fill: #0f766e; font-weight: 700; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#f8fafc"/>
  <text x="80" y="70" class="title">当前 SI-RPPO 中的 Transformer 预瞄编码结构</text>
  <text x="80" y="105" class="subtitle">代码配置：preview 450×2，token embedding 64，Transformer Encoder 2 层，4 头注意力，FFN=128，dropout=0</text>

  <!-- Inputs -->
  <rect x="70" y="175" width="230" height="105" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="95" y="212" class="box-title">车辆状态输入</text>
  <text x="95" y="242" class="box-text">s<tspan baseline-shift="sub">t</tspan>：14 维基础状态</text>
  <text x="95" y="268" class="small">车身/悬架/轮胎等状态</text>

  <rect x="70" y="445" width="230" height="105" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="95" y="482" class="box-title">道路预瞄输入</text>
  <text x="95" y="512" class="box-text">P<tspan baseline-shift="sub">t</tspan>：450 × 2 序列</text>
  <text x="95" y="538" class="small">前/后轮路面高程或速度 token</text>

  <!-- State branch -->
  <rect x="380" y="175" width="230" height="105" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="214" class="box-title">状态 MLP 编码</text>
  <text x="410" y="246" class="box-text">14 → 128 → 128 → 128</text>
  <text x="410" y="270" class="small">输出状态特征 128 维</text>

  <!-- Preview branch -->
  <rect x="380" y="420" width="230" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="454" class="box-title">Token 线性投影</text>
  <text x="410" y="482" class="box-text">2 → 64</text>

  <rect x="680" y="420" width="250" height="80" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="710" y="454" class="box-title">正弦位置编码</text>
  <text x="710" y="482" class="box-text">加入序列位置信息</text>

  <rect x="1000" y="305" width="360" height="270" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1030" y="345" class="box-title">Transformer Encoder Layer × 2</text>
  <text x="1030" y="376" class="box-text">每层结构：</text>
  <rect x="1030" y="398" width="300" height="42" rx="8" fill="#ffedd5" stroke="#fb923c"/>
  <text x="1055" y="425" class="box-text">Multi-Head Self-Attention：4 heads</text>
  <rect x="1030" y="454" width="300" height="42" rx="8" fill="#ffedd5" stroke="#fb923c"/>
  <text x="1055" y="481" class="box-text">Add &amp; LayerNorm</text>
  <rect x="1030" y="510" width="300" height="42" rx="8" fill="#ffedd5" stroke="#fb923c"/>
  <text x="1055" y="537" class="box-text">Feed Forward：64 → 128 → 64，ReLU</text>

  <rect x="1000" y="635" width="260" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="669" class="box-title">时间维均值池化</text>
  <text x="1030" y="697" class="box-text">mean over preview steps</text>

  <rect x="1345" y="635" width="200" height="80" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" filter="url(#shadow)"/>
  <text x="1375" y="669" class="box-title">预瞄特征</text>
  <text x="1375" y="697" class="box-text">64 维</text>

  <!-- Fusion and heads -->
  <rect x="725" y="175" width="250" height="105" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="755" y="214" class="box-title">特征融合</text>
  <text x="755" y="246" class="box-text">[状态 128 ; 预瞄 64]</text>
  <text x="755" y="270" class="small">融合特征 192 维</text>

  <rect x="1065" y="135" width="230" height="105" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095" y="174" class="box-title">策略主干 MLP</text>
  <text x="1095" y="206" class="box-text">192 → 256 → 256</text>

  <rect x="1365" y="95" width="185" height="90" rx="12" fill="#fae8ff" stroke="#c026d3" stroke-width="2" filter="url(#shadow)"/>
  <text x="1392" y="130" class="box-title">高斯策略头</text>
  <text x="1392" y="158" class="box-text">μ，log σ</text>

  <rect x="1365" y="220" width="185" height="90" rx="12" fill="#ffe4e6" stroke="#e11d48" stroke-width="2" filter="url(#shadow)"/>
  <text x="1392" y="255" class="box-title">动作输出</text>
  <text x="1392" y="283" class="box-text">tanh × 5000 N</text>

  <rect x="1065" y="245" width="230" height="90" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095" y="281" class="box-title">价值网络头</text>
  <text x="1095" y="309" class="box-text">192 → 256 → 256 → V(o<tspan baseline-shift="sub">t</tspan>)</text>

  <rect x="1245" y="770" width="305" height="75" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
  <text x="1275" y="802" class="box-title">安全执行层（Transformer 外部）</text>
  <text x="1275" y="830" class="box-text">安全教师门控 + 动作限幅 + 变化率约束</text>

  <!-- Arrows -->
  <path class="arrow" d="M300 228 L380 228"/>
  <path class="arrow" d="M300 497 L380 462"/>
  <path class="arrow" d="M610 460 L680 460"/>
  <path class="arrow" d="M930 460 L1000 440"/>
  <path class="arrow" d="M1180 575 L1180 635"/>
  <path class="arrow" d="M1260 675 L1345 675"/>
  <path class="arrow" d="M610 228 L725 228"/>
  <path class="arrow" d="M1445 635 C1445 500 1010 320 975 245"/>
  <path class="arrow" d="M975 228 L1065 188"/>
  <path class="arrow" d="M1295 188 L1365 140"/>
  <path class="arrow" d="M1458 185 L1458 220"/>
  <path class="arrow" d="M975 245 L1065 290"/>
  <path class="dash" d="M1458 310 L1458 770"/>

  <!-- Notes -->
  <rect x="80" y="780" width="880" height="62" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="105" y="808" class="note">说明：</text>
  <text x="160" y="808" class="box-text">“Transformer 编码器 2层，4头注意力”只对应橙色模块；完整策略网络还包括状态 MLP、均值池化、特征融合、策略/价值头和安全执行层。</text>
  <text x="160" y="834" class="small">若 PPT 页面空间有限，可以只保留绿色预瞄分支 + 橙色 Transformer 模块 + 融合输出。</text>
</svg>
