  <g id="header">
    <text x="56" y="72" font-family="SimHei, Arial, sans-serif" font-size="34" fill="#031D40">当前剩余问题集中在模型鲁棒性、能耗折中和预瞄误差</text>
    <text x="1224" y="72" font-family="&quot;Microsoft YaHei&quot;, Calibri, Arial, sans-serif" font-size="13" fill="#7A869A" text-anchor="end">15 / 16</text>
  </g>
  <g id="matrix-header">
