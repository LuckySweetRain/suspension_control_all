    <path d="M16 12l5 5l-4 4l-5 -5" />
    <path d="M16 17l-1.5 1.5" />
  </g>
    <text x="138" y="213" font-family="SimHei, Arial, sans-serif" font-size="18" fill="#031D40">SPDF 模型依赖较强</text>
    <text x="138" y="238" font-family="&quot;Microsoft YaHei&quot;, Calibri, Arial, sans-serif" font-size="14" fill="#4B5563">依赖较准确动力学模型、参数上界和执行器建模</text>
    <path fill="#FFF1F2" stroke="#D9E2EF" stroke-width="1" d="M575,204 H641 A15,15 0 0 1 656,219 V219 A15,15 0 0 1 641,234 H575 A15,15 0 0 1 560,219 V219 A15,15 0 0 1 575,204 Z" />
    <text x="608" y="225" font-family="SimHei, Arial, sans-serif" font-size="14" fill="#B91C1C" text-anchor="middle">高</text>
    <text x="734" y="213" font-family="&quot;Microsoft YaHei&quot;, Calibri, Arial, sans-serif" font-size="16" fill="#1D2430">补充参数摄动、传感误差和执行器限幅下的鲁棒性实验</text>
    <text x="734" y="238" font-family="&quot;Microsoft YaHei&quot;, Calibri, Arial, sans-serif" font-size="14" fill="#4B5563">明确 SPDF 可用边界和参数整定流程</text>
    <rect x="64" y="258" width="1152" height="78" fill="#F3F6FA" stroke="#D9E2EF" stroke-width="1" />
    
  <g transform="translate(92, 282) scale(1.25)" fill="none" stroke="#4472C4" stroke-width="2">
