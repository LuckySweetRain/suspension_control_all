  <g id="takeaways">
    <rect x="64" y="462" width="344" height="128" rx="6" fill="#FFF1F2" stroke="#D9E2EF" stroke-width="1"/>
    <text x="96" y="504" font-family="SimHei, Arial, sans-serif" font-size="22" fill="#B91C1C">SPDF</text>
    <text x="96" y="534" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="16" fill="#1D2430">减振指标最强，适合作为理论基准</text>
    <text x="96" y="562" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="16" fill="#4B5563">代价是执行器能耗和约束整定压力较高</text>
    <rect x="468" y="462" width="344" height="128" rx="6" fill="#EAF2FF" stroke="#D9E2EF" stroke-width="1"/>
    <text x="500" y="504" font-family="SimHei, Arial, sans-serif" font-size="22" fill="#031D40">SI-RPPO</text>
    <text x="500" y="534" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="16" fill="#1D2430">相对 PPO 回报提升，俯仰抑制明显增强</text>
    <text x="500" y="562" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="16" fill="#4B5563">体现示教初始化与安全门控的综合作用</text>
    <rect x="872" y="462" width="344" height="128" rx="6" fill="#F3F6FA" stroke="#D9E2EF" stroke-width="1"/>
    <text x="904" y="504" font-family="SimHei, Arial, sans-serif" font-size="22" fill="#031D40">MPC / PID</text>
    <text x="904" y="534" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="16" fill="#1D2430">结构清晰但对权重和模型精度敏感</text>
    <text x="904" y="562" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="16" fill="#4B5563">后续用于预瞄基线和专家数据补充</text>
  </g>
  <g id="footer">
    <text x="56" y="682" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="12" fill="#7A869A">评价覆盖六类控制器，综合比较舒适性、姿态、执行器能耗与安全约束</text>
  </g>
