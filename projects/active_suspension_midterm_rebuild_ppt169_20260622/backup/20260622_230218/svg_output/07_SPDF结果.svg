<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <path d="M56 112H1224 M56 650H1224" stroke="#D9E2EF" stroke-width="1"/>
  </g>
  <g id="header">
    <text x="56" y="72" font-family="SimHei, Arial, sans-serif" font-size="34" fill="#031D40">SPDF 在随机和凸包路面下显著压低车身与俯仰振动</text>
    <text x="1224" y="72" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="13" fill="#7A869A" text-anchor="end">07 / 16</text>
  </g>
  <g id="main-figure">
    <rect x="70" y="140" width="760" height="390" rx="6" fill="#F3F6FA" stroke="#D9E2EF" stroke-width="1"/>
    <image href="../images/midterm_class_b_response.png" x="98" y="164" width="704" height="322" preserveAspectRatio="xMidYMid meet"/>
    <text x="450" y="512" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="14" fill="#4B5563" text-anchor="middle">Class B 随机路面响应：SPDF 在车身垂向与俯仰响应上保持快速衰减</text>
  </g>
  <g id="right-claim">
    <rect x="872" y="140" width="338" height="390" rx="6" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1"/>
    <text x="906" y="186" font-family="SimHei, Arial, sans-serif" font-size="24" fill="#031D40">结果判断</text>
    <text x="906" y="238" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="18" fill="#1D2430">
      <tspan x="906" dy="0">SPDF 的优势集中在</tspan>
      <tspan x="906" dy="32" fill="#4472C4" font-weight="700">车身振动抑制</tspan>
      <tspan x="906" dy="32">和</tspan>
      <tspan x="906" dy="32" fill="#4472C4" font-weight="700">姿态响应收敛</tspan>
      <tspan x="906" dy="32">两个方面。</tspan>
    </text>
    <line x1="906" y1="386" x2="1170" y2="386" stroke="#D9E2EF" stroke-width="1"/>
    <text x="906" y="426" font-family="SimHei, Arial, sans-serif" font-size="20" fill="#B91C1C">需要关注</text>
    <text x="906" y="462" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="17" fill="#4B5563">
      <tspan x="906" dy="0">主动控制力和悬架行程约束</tspan>
      <tspan x="906" dy="28">需要结合执行器限幅整定。</tspan>
    </text>
  </g>
  <g id="metric-strip">
    <rect x="70" y="560" width="1140" height="66" rx="6" fill="#F3F6FA" stroke="#D9E2EF" stroke-width="1"/>
    <text x="104" y="600" font-family="SimHei, Arial, sans-serif" font-size="18" fill="#031D40">B 级随机：</text>
    <text x="218" y="600" font-family='Consolas, "Courier New", monospace' font-size="22" font-weight="700" fill="#4472C4">0.215 → 0.00186</text>
    <text x="456" y="600" font-family="SimHei, Arial, sans-serif" font-size="18" fill="#031D40">C 级随机：</text>
    <text x="570" y="600" font-family='Consolas, "Courier New", monospace' font-size="22" font-weight="700" fill="#4472C4">0.232 → 0.00195</text>
    <text x="808" y="600" font-family="SimHei, Arial, sans-serif" font-size="18" fill="#031D40">凸包：</text>
    <text x="870" y="600" font-family='Consolas, "Courier New", monospace' font-size="22" font-weight="700" fill="#4472C4">0.0875 → 0.000947</text>
  </g>
  <g id="footer">
    <text x="56" y="682" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="12" fill="#7A869A">指标为车身垂向加速度 RMS，来源于中期报告 SPDF 对比实验表</text>
  </g>
</svg>
