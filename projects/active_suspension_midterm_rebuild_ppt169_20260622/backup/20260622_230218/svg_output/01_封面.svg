<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgBlueWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF2FF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4472C4"/>
    </marker>
  </defs>
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="url(#bgBlueWash)"/>
    <path d="M80 80H1200 M80 160H1200 M80 240H1200 M80 320H1200 M80 400H1200 M80 480H1200 M80 560H1200 M80 640H1200 M160 60V660 M320 60V660 M480 60V660 M640 60V660 M800 60V660 M960 60V660 M1120 60V660" fill="none" stroke="#E8EEF7" stroke-width="1"/>
    <rect x="68" y="58" width="6" height="604" fill="#031D40"/>
  </g>
  <g id="title-block">
    <text x="112" y="176" font-family="SimHei, Arial, sans-serif" font-size="54" font-weight="700" fill="#031D40">
      <tspan x="112" dy="0">基于道路预瞄信息的</tspan>
      <tspan x="112" dy="72">主动悬架控制策略研究</tspan>
    </text>
    <text x="116" y="344" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="26" fill="#4B5563">中期答辩 · 模型控制与安全强化学习双主线推进</text>
    <line x1="116" y1="380" x2="650" y2="380" stroke="#4472C4" stroke-width="3"/>
    <text x="116" y="432" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="20" fill="#1D2430">
      <tspan x="116" dy="0">SPDF：周期滞后滑模控制，提供可证明的快速收敛基准</tspan>
      <tspan x="116" dy="36">SI-RPPO：安全教师门控 PPO，利用道路预瞄信息学习主动控制</tspan>
    </text>
  </g>
  <g id="technical-tracks">
    <rect x="790" y="150" width="340" height="86" rx="6" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1.5"/>
    <use data-icon="tabler-outline/activity" x="818" y="176" width="36" height="36" fill="#4472C4" stroke-width="2"/>
    <text x="872" y="190" font-family="SimHei, Arial, sans-serif" font-size="22" fill="#031D40">SPDF</text>
    <text x="872" y="218" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#4B5563">实用指定时间收敛 · IJRNC/JCR Q1</text>
    <rect x="790" y="314" width="340" height="86" rx="6" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1.5"/>
    <use data-icon="tabler-outline/shield-check" x="818" y="340" width="36" height="36" fill="#4472C4" stroke-width="2"/>
    <text x="872" y="354" font-family="SimHei, Arial, sans-serif" font-size="22" fill="#031D40">SI-RPPO</text>
    <text x="872" y="382" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#4B5563">安全教师门控 · 动作可行性约束反馈</text>
    <line x1="960" y1="236" x2="960" y2="314" stroke="#4472C4" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <rect x="790" y="478" width="340" height="86" rx="6" fill="#F3F6FA" stroke="#D9E2EF" stroke-width="1.5"/>
    <use data-icon="tabler-outline/car" x="818" y="504" width="36" height="36" fill="#031D40" stroke-width="2"/>
    <text x="872" y="518" font-family="SimHei, Arial, sans-serif" font-size="22" fill="#031D40">主动悬架闭环验证</text>
    <text x="872" y="546" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#4B5563">半车模型 · 多路况 · 舒适性/安全性/能耗</text>
    <line x1="960" y1="400" x2="960" y2="478" stroke="#4472C4" stroke-width="3" marker-end="url(#arrowBlue)"/>
  </g>
  <g id="footer">
    <text x="116" y="654" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="14" fill="#7A869A">2026 年 6 月 · 研究生中期答辩</text>
    <text x="1164" y="654" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="12" fill="#7A869A" text-anchor="end">Active Suspension Control</text>
  </g>
</svg>
