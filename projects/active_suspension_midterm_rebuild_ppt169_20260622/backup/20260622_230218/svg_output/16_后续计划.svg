<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <path d="M56 112H1224 M56 650H1224" stroke="#D9E2EF" stroke-width="1"/>
  </g>
  <g id="header">
    <text x="56" y="72" font-family="SimHei, Arial, sans-serif" font-size="34" fill="#031D40">后续计划与致谢</text>
    <text x="1224" y="72" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="13" fill="#7A869A" text-anchor="end">16 / 16</text>
  </g>
  <g id="timeline">
    <text x="80" y="150" font-family="SimHei, Arial, sans-serif" font-size="24" fill="#031D40">中期以后工作安排</text>
    <path d="M120 280H1160" stroke="#4472C4" stroke-width="4"/>
    <circle cx="160" cy="280" r="14" fill="#031D40"/>
    <circle cx="480" cy="280" r="14" fill="#4472C4"/>
    <circle cx="800" cy="280" r="14" fill="#4472C4"/>
    <circle cx="1120" cy="280" r="14" fill="#B91C1C"/>
    <g id="phase-one">
      <rect x="80" y="320" width="245" height="164" rx="6" fill="#EAF2FF" stroke="#D9E2EF" stroke-width="1"/>
      <use data-icon="tabler-outline/tools" x="104" y="342" width="30" height="30" fill="#4472C4" stroke-width="2"/>
      <text x="148" y="365" font-family="SimHei, Arial, sans-serif" font-size="18" fill="#031D40">2026.06-08</text>
      <text x="104" y="406" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#1D2430">补充 SPDF 参数鲁棒性</text>
      <text x="104" y="432" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#1D2430">整定 MPC 权重与专家数据</text>
      <text x="104" y="458" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#1D2430">优化 SI-RPPO 消融和横向对比</text>
    </g>
    <g id="phase-two">
      <rect x="397" y="320" width="245" height="164" rx="6" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1"/>
      <use data-icon="tabler-outline/route" x="421" y="342" width="30" height="30" fill="#4472C4" stroke-width="2"/>
      <text x="465" y="365" font-family="SimHei, Arial, sans-serif" font-size="18" fill="#031D40">2026.08-10</text>
      <text x="421" y="406" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#1D2430">构建非理想道路预瞄模型</text>
      <text x="421" y="432" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#1D2430">评估噪声、时延、截断、缺失</text>
      <text x="421" y="458" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#1D2430">完善预瞄鲁棒控制实验</text>
    </g>
    <g id="phase-three">
      <rect x="714" y="320" width="245" height="164" rx="6" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1"/>
      <use data-icon="tabler-outline/cpu" x="738" y="342" width="30" height="30" fill="#4472C4" stroke-width="2"/>
      <text x="782" y="365" font-family="SimHei, Arial, sans-serif" font-size="18" fill="#031D40">2026.10-12</text>
      <text x="738" y="406" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#1D2430">准备硬件在环或实车条件</text>
      <text x="738" y="432" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#1D2430">验证实时性和安全回退</text>
      <text x="738" y="458" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#1D2430">补齐工程可用性指标</text>
    </g>
    <g id="phase-four">
      <rect x="1031" y="320" width="185" height="164" rx="6" fill="#FFF1F2" stroke="#D9E2EF" stroke-width="1"/>
      <use data-icon="tabler-outline/flag" x="1054" y="342" width="30" height="30" fill="#B91C1C" stroke-width="2"/>
      <text x="1096" y="365" font-family="SimHei, Arial, sans-serif" font-size="17" fill="#B91C1C">2026.12-2027.01</text>
      <text x="1054" y="406" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#1D2430">汇总实验结果</text>
      <text x="1054" y="432" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#1D2430">撰写学位论文</text>
      <text x="1054" y="458" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#1D2430">整理相关论文</text>
    </g>
  </g>
  <g id="thanks">
    <text x="640" y="590" font-family="SimHei, Arial, sans-serif" font-size="38" fill="#031D40" text-anchor="middle">请各位老师批评指正</text>
  </g>
  <g id="footer">
    <text x="56" y="682" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="12" fill="#7A869A">后续计划围绕鲁棒性、非理想预瞄、实时安全验证和论文整理展开</text>
  </g>
</svg>
