<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <path d="M56 112H1224 M56 650H1224" stroke="#D9E2EF" stroke-width="1"/>
  </g>
  <g id="header">
    <text x="56" y="72" font-family="SimHei, Arial, sans-serif" font-size="34" fill="#031D40">统一仿真平台支撑六类控制方法和七种路况横向评估</text>
    <text x="1224" y="72" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="13" fill="#7A869A" text-anchor="end">11 / 16</text>
  </g>
  <g id="platform-layers">
    <rect x="80" y="150" width="720" height="86" rx="6" fill="#F3F6FA" stroke="#D9E2EF" stroke-width="1"/>
    <use data-icon="tabler-outline/route" x="110" y="176" width="34" height="34" fill="#4472C4" stroke-width="2"/>
    <text x="162" y="186" font-family="SimHei, Arial, sans-serif" font-size="22" fill="#031D40">路面激励层</text>
    <text x="162" y="216" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="16" fill="#4B5563">ISO B/C、正弦、凸包、阶跃、凹坑、复合路面</text>
    <rect x="80" y="258" width="720" height="86" rx="6" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1"/>
    <use data-icon="tabler-outline/car" x="110" y="284" width="34" height="34" fill="#4472C4" stroke-width="2"/>
    <text x="162" y="294" font-family="SimHei, Arial, sans-serif" font-size="22" fill="#031D40">半车动力学层</text>
    <text x="162" y="324" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="16" fill="#4B5563">非线性半车模型、悬架动行程、轮胎动载荷与执行器约束</text>
    <rect x="80" y="366" width="720" height="86" rx="6" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1"/>
    <use data-icon="tabler-outline/cpu" x="110" y="392" width="34" height="34" fill="#4472C4" stroke-width="2"/>
    <text x="162" y="402" font-family="SimHei, Arial, sans-serif" font-size="22" fill="#031D40">控制器接口层</text>
    <text x="162" y="432" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="16" fill="#4B5563">PASSIVE、PID、SPDF、MPC、PPO scratch、SI-RPPO</text>
    <rect x="80" y="474" width="720" height="86" rx="6" fill="#EAF2FF" stroke="#D9E2EF" stroke-width="1"/>
    <use data-icon="tabler-outline/chart-line" x="110" y="500" width="34" height="34" fill="#031D40" stroke-width="2"/>
    <text x="162" y="510" font-family="SimHei, Arial, sans-serif" font-size="22" fill="#031D40">训练评估层</text>
    <text x="162" y="540" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="16" fill="#4B5563">训练脚本、评估脚本、指标统计与可视化输出统一管理</text>
  </g>
  <g id="reward-panel">
    <rect x="848" y="150" width="350" height="410" rx="6" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1"/>
    <text x="882" y="198" font-family="SimHei, Arial, sans-serif" font-size="24" fill="#031D40">奖励归一化改进</text>
    <text x="882" y="238" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="16" fill="#4B5563">以被动悬架统计二阶矩归一化，使各分项权重稳定命中预设语义比例。</text>
    <g id="bar-body">
      <text x="882" y="300" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#1D2430">车身舒适性 0.45</text>
      <rect x="882" y="316" width="250" height="12" rx="6" fill="#EAF2FF"/>
      <rect x="882" y="316" width="188" height="12" rx="6" fill="#4472C4"/>
    </g>
    <g id="bar-pitch">
      <text x="882" y="358" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#1D2430">俯仰 0.20</text>
      <rect x="882" y="374" width="250" height="12" rx="6" fill="#EAF2FF"/>
      <rect x="882" y="374" width="84" height="12" rx="6" fill="#4472C4"/>
    </g>
    <g id="bar-suspension">
      <text x="882" y="416" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#1D2430">悬架行程 0.25</text>
      <rect x="882" y="432" width="250" height="12" rx="6" fill="#EAF2FF"/>
      <rect x="882" y="432" width="104" height="12" rx="6" fill="#4472C4"/>
    </g>
    <g id="bar-tire">
      <text x="882" y="474" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#1D2430">轮胎动载 0.10</text>
      <rect x="882" y="490" width="250" height="12" rx="6" fill="#EAF2FF"/>
      <rect x="882" y="490" width="42" height="12" rx="6" fill="#4472C4"/>
    </g>
  </g>
  <g id="takeaway">
    <text x="80" y="614" font-family="SimHei, Arial, sans-serif" font-size="20" fill="#031D40">关键效果：</text>
    <text x="186" y="614" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="18" fill="#1D2430">修正后 PPO 类在线算法从发散状态恢复为稳定收敛。</text>
  </g>
  <g id="footer">
    <text x="56" y="682" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="12" fill="#7A869A">平台实现覆盖模型、控制器、路面、训练和评估全流程</text>
  </g>
</svg>
