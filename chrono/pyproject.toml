[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chrono-active-suspension"
version = "0.1.0"
description = "Seven-DOF active suspension with Project Chrono, native visualization and parallel RL"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["chrono_suspension*"]
