# Chrono Sedan 10.0.0-derived generic passenger-car research reference.
# This is NOT a calibrated replica or a completed geometric reduction of Sedan.
# All units are SI; four-corner arrays are [FL, FR, RL, RR].
# Evidence and source/derived/assumed classifications: docs/parameter_sources.md.
seed: 42

physics:
  dt: 0.001
  control_dt: 0.01
  episode_seconds: 10.0

vehicle:
  # Directly sourced chassis body properties; treated as the sprung body here.
  sprung_mass_kg: 1515.0
  inertia_kgm2: [222.8, 944.1, 1053.5]
  front_distance_m: 1.388
  rear_distance_m: 1.388
  front_half_track_m: 0.7979
  rear_half_track_m: 0.8

  # Engineering assumptions: wheel-equivalent masses/rates, NOT raw Sedan
  # spring or damper coefficients. No motion-ratio reduction is claimed.
  unsprung_mass_kg: [45.0, 45.0, 45.0, 45.0]
  suspension_stiffness_npm: [30000.0, 30000.0, 32000.0, 32000.0]
  suspension_damping_nspm: [2200.0, 2200.0, 2400.0, 2400.0]
  body_height_m: 0.72

  # Reproduced from official Sedan 245/40R18 + TMeasy estimation formulas.
  # These are formula-derived values, not measured tire data.
  tire_radius_m: 0.3266
  tire_stiffness_npm: [456715.5612, 456715.5612, 456715.5612, 456715.5612]
  tire_damping_nspm: [2291.7742, 2291.7742, 2291.7742, 2291.7742]

  # Explicit research assumptions; neutral spring/damping nonlinearity by
  # default, with progressive bump/rebound stops and unilateral tire forces.
  spring_cubic_npm3: 0.0
  rebound_damping_ratio: 1.0
  compression_damping_ratio: 1.0
  bump_stop_start_m: 0.065
  travel_limit_m: 0.09
  bump_stop_npm2: 2000000.0

# Per-corner actuator assumptions. No actuator data are provided by Sedan.
actuator:
  force_limit_n: 3500.0
  time_constant_s: 0.02
  delay_s: 0.01
  rate_limit_nps: 50000.0
  power_limit_w: 5000.0
