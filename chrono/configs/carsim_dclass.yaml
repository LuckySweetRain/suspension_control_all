metadata:
  vehicle_preset: carsim_dclass
  source_vehicle: CarSim 2020.0 D-Class Sedan
  parameter_status: verified static input transfer; reduced seven-DOF model
  source_audit: results/chrono/carsim/source_audit.json
  corner_order:
  - FL
  - FR
  - RL
  - RR
  reference_pitch_rad: 0.0
  design_geometry_static_pitch_rad: 0.007362697571795399
  source_suspension_motion_ratio:
  - 0.65144
  - 0.65144
  - 0.797
  - 0.797
  damper_interpolation: piecewise_linear (source is SPLINE)
  damper_table_extrapolation: terminal_segment_linear
  stop_table_extrapolation: terminal_segment_linear
  tire_vertical_damping_status: zero for elastic CarSim tabular vertical tire
  actuator_status: unchanged research assumptions; no hardware parameters identified
  assumptions:
    suspension_mount_height_m: 0 relative to sprung CG; equivalent seven-DOF mounting plane, not a
      measured hardpoint
    travel_limit_m: .09 symmetric research design/reward threshold; termination uses 2*limit and
      mounting geometry guards, not the imported asymmetric physical stop onset
    bump_stop_start_m: .065 retained inactive compatibility value; generic stop coefficient is zero
      and tabular stops replace it
    spring_cubic_npm3: '0: retain source linear spring law without inventing a cubic nonlinearity'
    damping_multipliers: '1: imported damper table already specifies compression/rebound asymmetry'
    suspension_damping_nspm: zero-speed tangent for analysis only; damper table replaces, does not
      add to, this term
  limitations:
  - 'Static input transfer only: CarSim was not run and response equivalence has not been validated.'
  - The March 2026 echo explicitly reports initialization failure. It supplies units/definitions and
    cross-checks only; the August 2026 expanded INPUT is authoritative.
  - Strict seven-DOF reduction fixes longitudinal/lateral translation, yaw and wheel rotation; it
    omits suspension kinematic/compliance maps, tire shear, steering, driveline and aerodynamics.
  - CarSim H_CG_SU is relative to the design sprung-mass origin. The mapped world CG height is derived
    from design wheel-center heights and static tire compression; the reduced model resets its reference
    pitch to zero.
  - CarSim FD_TABLE requests SPLINE. The reduced model uses piecewise-linear interpolation through
    the same transformed table points, including declared endpoint extrapolation; it is not the proprietary
    spline implementation.
  - Spring stiffness is reduced by motion-ratio squared; CarSim spring hysteresis offsets +/-20 N
    and the 2 mm hysteresis memory are omitted.
  - The tabular tire uses an elastic vertical spring with lift-off at zero; zero vertical damping
    is selected. Effective rolling radius 0.325 m is not substituted for free radius 0.334 m.
  - CarSim active inputs Replace damper force in FL,RL,FR,RR order (duplicated eight ports), whereas
    Chrono adds actuator force to passive suspension in FL,FR,RL,RR order. Control I/O is not equivalent.
  - Road geometry, speed, actuator dynamics, sensor noise, rewards, and travel termination are research
    settings, not imported CarSim identification results.
