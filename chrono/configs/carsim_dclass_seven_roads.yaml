# Imported D-Class mechanics plus the existing seven research road scenarios.
# These road settings are not taken from the CarSim Bounce Sine Sweep procedure.
# Each reset selects one scenario uniformly; explicit evaluation bypasses it.
inherits: carsim_dclass.yaml
road:
  speed_mps: 15.0
  left_right_correlation: 0.6
  run_in_m: 3.0
  scenarios:
  - tracks: both
    run_in_m: 3.0
    left_right_correlation: 0.6
    kind: iso_b
    level: B
    gdn0_m3: 6.4e-05
    n_min_per_m: 0.02
    n_max_per_m: 2.0
    spectral_modes: 256
  - tracks: both
    run_in_m: 3.0
    left_right_correlation: 0.6
    kind: iso_c
    level: C
    gdn0_m3: 0.000256
    n_min_per_m: 0.02
    n_max_per_m: 2.0
    spectral_modes: 256
  - tracks: both
    run_in_m: 3.0
    left_right_correlation: 0.6
    kind: sine
    height_m: 0.03
    wavelength_m: 5.0
    phase_rad: 0.0
  - tracks: both
    run_in_m: 3.0
    left_right_correlation: 0.6
    kind: step
    height_m: 0.03
    start_m: 9.0
    transition_length_m: 0.3
  - tracks: both
    run_in_m: 3.0
    left_right_correlation: 0.6
    kind: pothole
    height_m: 0.03
    length_m: 0.8
    start_m: 9.0
  - tracks: both
    run_in_m: 3.0
    left_right_correlation: 0.6
    kind: bump
    height_m: 0.03
    length_m: 0.8
    start_m: 9.0
  - tracks: both
    run_in_m: 3.0
    left_right_correlation: 0.6
    kind: composite
    components:
    - kind: iso_b
      level: B
      gdn0_m3: 6.4e-05
      n_min_per_m: 0.02
      n_max_per_m: 2.0
      spectral_modes: 256
    - kind: bump
      height_m: 0.03
      length_m: 0.8
      start_m: 30.0
    - kind: pothole
      height_m: 0.03
      length_m: 0.8
      start_m: 75.0
