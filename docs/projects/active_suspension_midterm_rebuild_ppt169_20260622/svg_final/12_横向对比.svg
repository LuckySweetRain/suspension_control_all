    <text x="500" y="534" font-family="&quot;Microsoft YaHei&quot;, Calibri, Arial, sans-serif" font-size="16" fill="#1D2430">相对 PPO 回报提升，俯仰抑制明显增强</text>
    <text x="500" y="562" font-family="&quot;Microsoft YaHei&quot;, Calibri, Arial, sans-serif" font-size="16" fill="#4B5563">体现示教初始化与安全门控的综合作用</text>
    <path fill="#F3F6FA" stroke="#D9E2EF" stroke-width="1" d="M878,462 H1210 A6,6 0 0 1 1216,468 V584 A6,6 0 0 1 1210,590 H878 A6,6 0 0 1 872,584 V468 A6,6 0 0 1 878,462 Z" />
