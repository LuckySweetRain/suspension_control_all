  <g id="takeaways">
    <path fill="#FFF1F2" stroke="#D9E2EF" stroke-width="1" d="M70,462 H402 A6,6 0 0 1 408,468 V584 A6,6 0 0 1 402,590 H70 A6,6 0 0 1 64,584 V468 A6,6 0 0 1 70,462 Z" />
    <text x="96" y="504" font-family="SimHei, Arial, sans-serif" font-size="22" fill="#B91C1C">SPDF</text>
    <text x="96" y="534" font-family="&quot;Microsoft YaHei&quot;, Calibri, Arial, sans-serif" font-size="16" fill="#1D2430">减振指标最强，适合作为理论基准</text>
    <text x="96" y="562" font-family="&quot;Microsoft YaHei&quot;, Calibri, Arial, sans-serif" font-size="16" fill="#4B5563">代价是执行器能耗和约束整定压力较高</text>
    <path fill="#EAF2FF" stroke="#D9E2EF" stroke-width="1" d="M474,462 H806 A6,6 0 0 1 812,468 V584 A6,6 0 0 1 806,590 H474 A6,6 0 0 1 468,584 V468 A6,6 0 0 1 474,462 Z" />
