<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <path d="M56 112H1224 M56 650H1224" stroke="#D9E2EF" stroke-width="1"/>
  </g>
  <g id="header">
    <text x="56" y="72" font-family="SimHei, Arial, sans-serif" font-size="34" fill="#031D40">SI-RPPO 让 PPO 在安全教师门控下直接输出主动控制力</text>
    <text x="1224" y="72" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="13" fill="#7A869A" text-anchor="end">09 / 16</text>
  </g>
  <g id="main-network">
    <rect x="70" y="142" width="780" height="442" rx="6" fill="#F3F6FA" stroke="#D9E2EF" stroke-width="1"/>
    <image href="../images/sirppo_policy_network.png" x="104" y="170" width="712" height="400" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="callout-1">
    <rect x="892" y="154" width="318" height="116" rx="6" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1"/>
    <use data-icon="tabler-outline/brain" x="916" y="184" width="34" height="34" fill="#4472C4" stroke-width="2"/>
    <text x="966" y="192" font-family="SimHei, Arial, sans-serif" font-size="20" fill="#031D40">预瞄编码</text>
    <text x="966" y="224" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#4B5563">
      <tspan x="966" dy="0">Transformer 编码未来路面</tspan>
      <tspan x="966" dy="23">高程序列，提前形成控制动作。</tspan>
    </text>
  </g>
  <g id="callout-2">
    <rect x="892" y="306" width="318" height="116" rx="6" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1"/>
    <use data-icon="tabler-outline/shield-check" x="916" y="336" width="34" height="34" fill="#4472C4" stroke-width="2"/>
    <text x="966" y="344" font-family="SimHei, Arial, sans-serif" font-size="20" fill="#031D40">安全教师门控</text>
    <text x="966" y="376" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#4B5563">
      <tspan x="966" dy="0">低激励或低安全裕度时</tspan>
      <tspan x="966" dy="23">回退到被动安全行为。</tspan>
    </text>
  </g>
  <g id="callout-3">
    <rect x="892" y="458" width="318" height="116" rx="6" fill="#EAF2FF" stroke="#D9E2EF" stroke-width="1"/>
    <use data-icon="tabler-outline/tools" x="916" y="488" width="34" height="34" fill="#031D40" stroke-width="2"/>
    <text x="966" y="496" font-family="SimHei, Arial, sans-serif" font-size="20" fill="#031D40">动作可行性修正</text>
    <text x="966" y="528" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#4B5563">
      <tspan x="966" dy="0">幅值、变化率和安全裕度</tspan>
      <tspan x="966" dy="23">共同约束最终执行力。</tspan>
    </text>
  </g>
  <g id="takeaway">
    <text x="70" y="624" font-family="SimHei, Arial, sans-serif" font-size="20" fill="#031D40">部署差异：</text>
    <text x="176" y="624" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="18" fill="#1D2430">训练阶段用 SPDF 轨迹示教，部署阶段不需要同步运行 SPDF 或 MPC 专家控制器。</text>
  </g>
  <g id="footer">
    <text x="56" y="682" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="12" fill="#7A869A">来源：中期报告 SI-RPPO 总体框架与策略网络图</text>
  </g>
</svg>
