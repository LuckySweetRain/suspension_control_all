<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <path d="M56 112H1224 M56 650H1224" stroke="#D9E2EF" stroke-width="1"/>
  </g>
  <g id="header">
    <text x="56" y="72" font-family="SimHei, Arial, sans-serif" font-size="34" fill="#031D40">中期阶段已形成“模型控制 + 安全强化学习”的完整闭环</text>
    <text x="1224" y="72" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="13" fill="#7A869A" text-anchor="end">03 / 16</text>
  </g>
  <g id="kpi-card-paper">
    <rect x="72" y="150" width="536" height="190" rx="6" fill="#F3F6FA" stroke="#D9E2EF" stroke-width="1"/>
    <use data-icon="tabler-outline/check" x="104" y="186" width="38" height="38" fill="#0F766E" stroke-width="2"/>
    <text x="160" y="202" font-family="SimHei, Arial, sans-serif" font-size="24" fill="#031D40">论文成果</text>
    <text x="160" y="244" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="42" font-weight="700" fill="#0F766E">IJRNC Q1</text>
    <text x="160" y="284" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="17" fill="#4B5563">SPDF 相关成果已发表，为后续教师轨迹提供理论基准。</text>
  </g>
  <g id="kpi-card-platform">
    <rect x="672" y="150" width="536" height="190" rx="6" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1"/>
    <use data-icon="tabler-outline/cpu" x="704" y="186" width="38" height="38" fill="#4472C4" stroke-width="2"/>
    <text x="760" y="202" font-family="SimHei, Arial, sans-serif" font-size="24" fill="#031D40">仿真平台</text>
    <text x="760" y="244" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="42" font-weight="700" fill="#4472C4">6 方法 × 7 路况</text>
    <text x="760" y="284" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="17" fill="#4B5563">统一比较 PASSIVE、PID、SPDF、MPC、PPO 与 SI-RPPO。</text>
  </g>
  <g id="kpi-card-methods">
    <rect x="72" y="386" width="536" height="190" rx="6" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1"/>
    <use data-icon="tabler-outline/route" x="104" y="422" width="38" height="38" fill="#4472C4" stroke-width="2"/>
    <text x="160" y="438" font-family="SimHei, Arial, sans-serif" font-size="24" fill="#031D40">方法主线</text>
    <text x="160" y="480" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="42" font-weight="700" fill="#031D40">SPDF + SI-RPPO</text>
    <text x="160" y="520" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="17" fill="#4B5563">一条负责可证明收敛，一条负责预瞄利用和在线泛化。</text>
  </g>
  <g id="kpi-card-results">
    <rect x="672" y="386" width="536" height="190" rx="6" fill="#F3F6FA" stroke="#D9E2EF" stroke-width="1"/>
    <use data-icon="tabler-outline/chart-line" x="704" y="422" width="38" height="38" fill="#B91C1C" stroke-width="2"/>
    <text x="760" y="438" font-family="SimHei, Arial, sans-serif" font-size="24" fill="#031D40">阶段结果</text>
    <text x="760" y="480" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="42" font-weight="700" fill="#B91C1C">-762 → -578</text>
    <text x="760" y="520" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="17" fill="#4B5563">SI-RPPO 相比 PPO scratch 提升最终评估回报。</text>
  </g>
  <g id="takeaway">
    <text x="72" y="626" font-family="SimHei, Arial, sans-serif" font-size="22" fill="#031D40">阶段判断：</text>
    <text x="188" y="626" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="20" fill="#1D2430">已完成从理论控制、仿真框架到安全强化学习验证的主闭环。</text>
  </g>
  <g id="footer">
    <text x="56" y="682" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="12" fill="#7A869A">数据来源：中期报告整理</text>
  </g>
</svg>
