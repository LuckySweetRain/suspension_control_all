<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <path d="M56 112H1224 M56 650H1224" stroke="#D9E2EF" stroke-width="1"/>
  </g>
  <g id="header">
    <text x="56" y="72" font-family="SimHei, Arial, sans-serif" font-size="34" fill="#031D40">当前剩余问题集中在模型鲁棒性、能耗折中和预瞄误差</text>
    <text x="1224" y="72" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="13" fill="#7A869A" text-anchor="end">15 / 16</text>
  </g>
  <g id="matrix-header">
    <rect x="64" y="136" width="1152" height="44" rx="6" fill="#031D40"/>
    <text x="96" y="164" font-family="SimHei, Arial, sans-serif" font-size="18" fill="#FFFFFF">当前问题</text>
    <text x="608" y="164" font-family="SimHei, Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">优先级</text>
    <text x="760" y="164" font-family="SimHei, Arial, sans-serif" font-size="18" fill="#FFFFFF">改进方向</text>
  </g>
  <g id="problem-matrix">
    <rect x="64" y="180" width="1152" height="78" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1"/>
    <use data-icon="tabler-outline/tools" x="92" y="204" width="30" height="30" fill="#4472C4" stroke-width="2"/>
    <text x="138" y="213" font-family="SimHei, Arial, sans-serif" font-size="18" fill="#031D40">SPDF 模型依赖较强</text>
    <text x="138" y="238" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="14" fill="#4B5563">依赖较准确动力学模型、参数上界和执行器建模</text>
    <rect x="560" y="204" width="96" height="30" rx="15" fill="#FFF1F2" stroke="#D9E2EF" stroke-width="1"/>
    <text x="608" y="225" font-family="SimHei, Arial, sans-serif" font-size="14" fill="#B91C1C" text-anchor="middle">高</text>
    <text x="734" y="213" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="16" fill="#1D2430">补充参数摄动、传感误差和执行器限幅下的鲁棒性实验</text>
    <text x="734" y="238" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="14" fill="#4B5563">明确 SPDF 可用边界和参数整定流程</text>
    <rect x="64" y="258" width="1152" height="78" fill="#F3F6FA" stroke="#D9E2EF" stroke-width="1"/>
    <use data-icon="tabler-outline/target" x="92" y="282" width="30" height="30" fill="#4472C4" stroke-width="2"/>
    <text x="138" y="291" font-family="SimHei, Arial, sans-serif" font-size="18" fill="#031D40">MPC 权重和专家数据不足</text>
    <text x="138" y="316" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="14" fill="#4B5563">舒适性权重尚未充分整定，复杂路况下稳定性不足</text>
    <rect x="560" y="282" width="96" height="30" rx="15" fill="#FFF1F2" stroke="#D9E2EF" stroke-width="1"/>
    <text x="608" y="303" font-family="SimHei, Arial, sans-serif" font-size="14" fill="#B91C1C" text-anchor="middle">高</text>
    <text x="734" y="291" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="16" fill="#1D2430">采用归一化指标和多目标搜索重新整定权重</text>
    <text x="734" y="316" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="14" fill="#4B5563">作为预瞄基线和强化学习专家数据来源</text>
    <rect x="64" y="336" width="1152" height="78" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1"/>
    <use data-icon="tabler-outline/gauge" x="92" y="360" width="30" height="30" fill="#4472C4" stroke-width="2"/>
    <text x="138" y="369" font-family="SimHei, Arial, sans-serif" font-size="18" fill="#031D40">SI-RPPO 能耗折中仍需优化</text>
    <text x="138" y="394" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="14" fill="#4B5563">回报和舒适性提升依赖更高主动控制能量</text>
    <rect x="560" y="360" width="96" height="30" rx="15" fill="#EAF2FF" stroke="#D9E2EF" stroke-width="1"/>
    <text x="608" y="381" font-family="SimHei, Arial, sans-serif" font-size="14" fill="#031D40" text-anchor="middle">中高</text>
    <text x="734" y="369" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="16" fill="#1D2430">加入能耗约束、动作平滑项和多工况验证</text>
    <text x="734" y="394" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="14" fill="#4B5563">寻找舒适性收益与执行器负担之间的稳定折中</text>
    <rect x="64" y="414" width="1152" height="78" fill="#F3F6FA" stroke="#D9E2EF" stroke-width="1"/>
    <use data-icon="tabler-outline/route" x="92" y="438" width="30" height="30" fill="#4472C4" stroke-width="2"/>
    <text x="138" y="447" font-family="SimHei, Arial, sans-serif" font-size="18" fill="#031D40">当前预瞄仍偏理想</text>
    <text x="138" y="472" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="14" fill="#4B5563">尚未系统考虑上游感知的噪声、时延和缺失</text>
    <rect x="560" y="438" width="96" height="30" rx="15" fill="#FFF1F2" stroke="#D9E2EF" stroke-width="1"/>
    <text x="608" y="459" font-family="SimHei, Arial, sans-serif" font-size="14" fill="#B91C1C" text-anchor="middle">高</text>
    <text x="734" y="447" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="16" fill="#1D2430">构建非理想预瞄模型：噪声、时延、截断、局部缺失</text>
    <text x="734" y="472" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="14" fill="#4B5563">评估预瞄质量下降对控制性能的影响</text>
    <rect x="64" y="492" width="1152" height="78" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1"/>
    <use data-icon="tabler-outline/cpu" x="92" y="516" width="30" height="30" fill="#4472C4" stroke-width="2"/>
    <text x="138" y="525" font-family="SimHei, Arial, sans-serif" font-size="18" fill="#031D40">硬件在环和实时性验证仍在准备</text>
    <text x="138" y="550" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="14" fill="#4B5563">算法实时预算、接口和安全回退机制需要落地</text>
    <rect x="560" y="516" width="96" height="30" rx="15" fill="#EAF2FF" stroke="#D9E2EF" stroke-width="1"/>
    <text x="608" y="537" font-family="SimHei, Arial, sans-serif" font-size="14" fill="#031D40" text-anchor="middle">中</text>
    <text x="734" y="525" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="16" fill="#1D2430">准备 HIL 接口、实时仿真步长和安全边界测试</text>
    <text x="734" y="550" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="14" fill="#4B5563">为后续实车或台架条件验证奠定基础</text>
  </g>
  <g id="footer">
    <text x="56" y="682" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="12" fill="#7A869A">问题清单已经对应到后续实验、算法整定和验证平台建设任务</text>
  </g>
</svg>
