<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <path d="M56 112H1224 M56 650H1224" stroke="#D9E2EF" stroke-width="1"/>
  </g>
  <g id="header">
    <text x="56" y="72" font-family="SimHei, Arial, sans-serif" font-size="34" fill="#031D40">SPDF 通过周期滞后滑模面获得实用指定时间收敛</text>
    <text x="1224" y="72" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="13" fill="#7A869A" text-anchor="end">06 / 16</text>
  </g>
  <g id="left-method">
    <text x="70" y="164" font-family="SimHei, Arial, sans-serif" font-size="26" fill="#031D40">方法核心</text>
    <g id="method-step-1">
      <rect x="70" y="198" width="462" height="90" rx="6" fill="#F3F6FA" stroke="#D9E2EF" stroke-width="1"/>
      <text x="98" y="232" font-family='Consolas, "Courier New", monospace' font-size="20" font-weight="700" fill="#4472C4">01</text>
      <text x="148" y="232" font-family="SimHei, Arial, sans-serif" font-size="21" fill="#031D40">误差子系统分解</text>
      <text x="148" y="263" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="16" fill="#4B5563">将半车模型拆解为车身垂向和俯仰两个控制子问题。</text>
    </g>
    <g id="method-step-2">
      <rect x="70" y="314" width="462" height="90" rx="6" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1"/>
      <text x="98" y="348" font-family='Consolas, "Courier New", monospace' font-size="20" font-weight="700" fill="#4472C4">02</text>
      <text x="148" y="348" font-family="SimHei, Arial, sans-serif" font-size="21" fill="#031D40">周期滞后滑模面</text>
      <text x="148" y="379" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="16" fill="#4B5563">通过滞后反馈结构设计收敛时间，并控制误差邻域。</text>
    </g>
    <g id="method-step-3">
      <rect x="70" y="430" width="462" height="90" rx="6" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1"/>
      <text x="98" y="464" font-family='Consolas, "Courier New", monospace' font-size="20" font-weight="700" fill="#4472C4">03</text>
      <text x="148" y="464" font-family="SimHei, Arial, sans-serif" font-size="21" fill="#031D40">连续滑模控制律</text>
      <text x="148" y="495" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="16" fill="#4B5563">用连续切换函数抑制抖振，并给出 Lyapunov 稳定性分析。</text>
    </g>
    <rect x="70" y="552" width="462" height="44" rx="6" fill="#EAF2FF"/>
    <text x="96" y="580" font-family="SimHei, Arial, sans-serif" font-size="19" fill="#031D40">结论：</text>
    <text x="154" y="580" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="18" fill="#1D2430">当 t ≥ T 时，误差进入可调小邻域。</text>
  </g>
  <g id="right-figure">
    <rect x="590" y="154" width="620" height="430" rx="6" fill="#F3F6FA" stroke="#D9E2EF" stroke-width="1"/>
    <image href="../images/spdf_controller_framework.png" x="626" y="194" width="548" height="308" preserveAspectRatio="xMidYMid meet"/>
    <text x="900" y="542" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="15" fill="#4B5563" text-anchor="middle">SPDF 控制器结构：由模型误差、周期滞后滑模面和控制律共同构成闭环</text>
  </g>
  <g id="footer">
    <text x="56" y="682" font-family='"Microsoft YaHei", Calibri, Arial, sans-serif' font-size="12" fill="#7A869A">SPDF 结果已形成 IJRNC 期刊论文成果</text>
  </g>
</svg>
