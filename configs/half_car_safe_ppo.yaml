# SI-RPPO config（半车版）- v3
# 2026-06-21
# 核心设计：
#   1. 策略直接输出绝对力，由 policy_safety 限制变化率保证平滑
#   2. 预瞄 20 步 × 0.05s = 1.0s，80km/h 时覆盖 22m
#   3. 训练时 BC pretrain + BC anchor 参考专家（SPDF/MPC）
#   4. 部署时 improvement gate (passive teacher) + safety shield
inherits: default.yaml

# 预瞄：450 步 × 0.002s = 0.9s，22m/s 时覆盖 20m，每步间距 4.44cm
preview:
  steps: 450
  dt: 0.002

action_in_observation: false

# 取消 delta 参数化：策略直接输出绝对力，BC 预训练目标一致
policy_action_parameterization:
  enabled: false

# 安全屏蔽层：限制单步动作变化率 + 安全裕度收缩
policy_safety:
  enabled: true
  max_action_fraction: 1.0
  max_delta_fraction: 0.15
  hard_margin: 0.02
  soft_margin: 0.10

# safe-teacher improvement gate
policy_improvement_gate:
  enabled: true
  teacher: passive
  min_scale: 0.0
  max_scale: 0.5
  preview_rms_threshold: 0.05
  preview_rms_softness: 0.06
  accel_threshold: 0.8
  accel_softness: 1.0
  pitch_acc_scale: 0.2
  safety_margin_scale: true
  hard_margin: 0.04
  soft_margin: 0.2

# 专家用于训练（BC 预训练 + 锚定正则），部署时不运行
imitation:
  enabled: true
  dataset: datasets/expert/half_car_spdf.npz
  epochs: 20
  batch_size: 256
  max_steps_per_epoch: 200
  residual_targets: false
  eval_pretrained: true
  anchor_enabled: true
  anchor_initial_weight: 0.25
  anchor_final_weight: 0.02
  anchor_decay_episodes: 40
  anchor_batch_size: 256
  anchor_max_samples: 4096

# PPO 超参
rl:
  obs_dim_base: 14
  episodes: 400
  eval_every: 10
  save_every: 50
  batch_size: 256
  ppo:
    lam: 0.95
    clip_ratio: 0.12
    train_epochs: 8
    minibatch_size: 256
    entropy_coef: 0.0005
    value_coef: 0.5
    projection_penalty_weight: 0.2
    unsafe_penalty_weight: 1.0
    action_delta_penalty_weight: 0.4
    adaptive_constraint_weights: true
    constraint_weight_lr: 0.5
    projection_error_target: 0.18
    unsafe_fraction_target: 0.0
    action_delta_target: 0.02
    max_constraint_weight: 3.0

evaluation:
  controllers: ["PASSIVE", "SPDF", "MPC"]

safety_limits:
  max_suspension_travel: 0.08
